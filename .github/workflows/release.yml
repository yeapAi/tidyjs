name: Release VSIX

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version increment applied when the current version is already released'
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: macos-latest
    env:
      BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "::notice::Release $tag already exists"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            tag="v$(node -p "require('./package.json').version")"
            if gh release view "$tag" > /dev/null 2>&1; then
              npm version "$BUMP" --no-git-tag-version
              tag="v$(node -p "require('./package.json').version")"
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -am "chore: bump version to ${tag#v}"
              git push origin "HEAD:$BRANCH"
              echo "::notice::Version bumped to ${tag#v} on $BRANCH"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        run: npm ci

      - name: Build and package extension
        if: steps.version.outputs.skip != 'true'
        run: npm run build

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.version.outputs.sha }}
          name: Release ${{ steps.version.outputs.tag }}
          files: tidyjs-*.vsix
          fail_on_unmatched_files: true
          generate_release_notes: true
